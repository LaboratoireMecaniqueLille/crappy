# Run unittest checks with independent headless and graphical interpreters
name: Test Python Package

permissions:
  contents: read

on:
  # Runs on pull requests targeting the default branches
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: ["master", "develop"]

  # May also be started manually
  workflow_dispatch:

  # Runs automatically every first day of the month
  schedule:
    - cron: '0 12 1 * *'

jobs:
  test-python-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Run on all the supported Python versions
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # Run on all the supported platforms
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v6
    # Set up the correct version of Python
    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: tests/requirements.txt
    # Install packages required by Qt
    - name: Install Qt runtime dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libfontconfig1 libfreetype6 libgl1 \
          libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
          libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 \
          libxrender1
    # Install the build dependencies
    - name: Install build dependencies
      run: python -m pip install --upgrade pip wheel build setuptools
    # Install Crappy
    - name: Install Crappy
      run: python -m pip install .
    # Install the test dependencies
    - name: Install test dependencies
      run: |
        python -m pip install -r tests/requirements.txt
        python -m pip check
    # Keep the non-GUI suites independent of the runner's display state
    - name: Test Crappy (headless)
      shell: bash
      run: |
        python -m tests.run tests/unit
        python -m tests.run tests/integration
    # Keep Tk and Qt Blocks in separate interpreters to avoid crash on macOS
    # Grapher's Matplotlib tests use Agg, so its class belongs to the Qt group.
    # The Ubuntu runner is headless, xvfb-run starts and cleans up Xvfb for us
    - name: Test Crappy (graphical, Linux/Xvfb)
      if: runner.os == 'Linux'
      run: |
        CRAPPY_TEST_GUI=tkinter xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python -m tests.run tests/gui/tkinter
        CRAPPY_TEST_GUI=pyqt xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python -m tests.run tests/gui/pyqt
        CRAPPY_TEST_GUI=display xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python -m tests.run tests/gui/display/camera_processes
        CRAPPY_TEST_GUI=display xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python -m tests.run tests/gui/display/vision
    # GitHub-hosted Windows and macOS runners provide a native GUI session
    - name: Test Crappy (graphical, Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        CRAPPY_TEST_GUI=tkinter python -m tests.run tests/gui/tkinter
        CRAPPY_TEST_GUI=pyqt python -m tests.run tests/gui/pyqt
        CRAPPY_TEST_GUI=display python -m tests.run tests/gui/display/camera_processes
        CRAPPY_TEST_GUI=display python -m tests.run tests/gui/display/vision
    # On macOS, Tk test processes need to retain their first Tcl interpreter
    - name: Test Crappy (graphical, macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        CRAPPY_TEST_GUI=tkinter python -m tests.run tests/gui/tkinter
        CRAPPY_TEST_GUI=pyqt python -m tests.run tests/gui/pyqt
        CRAPPY_TEST_GUI=display python -m tests.run tests/gui/display/camera_processes
        CRAPPY_TEST_GUI=display python -m tests.run tests/gui/display/vision
