# Installs the Python dependencies, installs Crappy, and checks that it imports
name: Test Python Package

permissions:
  contents: read

on:
  # Runs on pull requests targeting the default branches
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: ["master", "develop"]

  # May also be started manually
  workflow_dispatch:

  # Runs automatically every first day of the month
  schedule:
    - cron: '0 12 1 * *'

jobs:
  test-python-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Run on all the supported Python versions
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Run on all the supported platforms
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v6
    # Set up the correct version of Python
    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    # Install the build and test dependencies
    - name: Install build dependencies
      run: python -m pip install --upgrade pip wheel build setuptools
    # Install Crappy
    - name: Install Crappy
      run: python -m pip install .
    # Install dependencies
    - name: Install test dependencies
      run: python -m pip install -r tests/requirements.txt
    # Keep the non-GUI suites independent of the runner's display state
    - name: Test Crappy (headless)
      env:
        MPLBACKEND: Agg
      run: |
        python -m unittest -v tests.actuator
        python -m unittest -v tests.block
        python -m unittest -v tests.blocks
        python -m unittest -v tests.camera
        python -m unittest -v tests.camera_configuration_tools
        python -m unittest -v tests.camera_process
        python -m unittest -v tests.camera_processes
        python -m unittest -v tests.generator_path
        python -m unittest -v tests.image_processing
        python -m unittest -v tests.inout
        python -m unittest -v tests.integration
        python -m unittest -v tests.modifier
    # The Ubuntu runner is headless; xvfb-run starts and cleans up Xvfb for us
    - name: Test Crappy (graphical, Linux/Xvfb)
      if: runner.os == 'Linux'
      env:
        MPLBACKEND: TkAgg
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m unittest -v tests.blocks_gui
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m unittest -v tests.camera_configuration
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m unittest -v tests.camera_processes_gui
    # GitHub-hosted Windows and macOS runners provide a native GUI session
    - name: Test Crappy (graphical, native)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      env:
        MPLBACKEND: TkAgg
      run: |
        python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()"
        python -m unittest -v tests.blocks_gui
        python -m unittest -v tests.camera_configuration
        python -m unittest -v tests.camera_processes_gui
